# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    # Skip this run if the push is only meant to rebuild the CI image
    # (e.g. a Dockerfile.ci/renv.lock update tagged "[build-image]" in the
    # commit message). Push again without the marker once build-image.yaml
    # has finished to actually build the site against the refreshed image.
    if: ${{ !contains(github.event.head_commit.message, 'build-image') }}
    runs-on: ubuntu-latest
    container: ghcr.io/cohhio/ryha-ci:latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Install package
        run: install.packages(".", repos = NULL, type = "source", dependencies = FALSE)
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
